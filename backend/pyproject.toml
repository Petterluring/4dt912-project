[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
description = "FastAPI backend for 4DT912 project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "pandas>=3.1.1",
    "numpy>=2.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "mypy>=2.4.1",
    "ruff>=0.17.6",
    "pandas-stubs>=3.1.0"
]

[tool.pytest]
testpaths = [
    "tests",
]

[tool.mypy]
strict = true
files = [
    "app",
]

[tool.ruff]
include = [
    "app/**/*.py",
    "tests/**/*.py",
]

line-length = 120

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["D103", "D102"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # Import sorting
    "D",  # Docstring conventions
    "W",  # pycodestyle warnings
]

ignore = [
    "D105", # Magic methods do not need docstrings.
    "D107", # __init__ methods do not need docstrings.
    "D211", # Incorrect blank line before class
    "D213", # Multi line summary second line
    "D203", # Ignore one line between class and docstring
    "D204", # Ignore one line between docstring and fields
]
