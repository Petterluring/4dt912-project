[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
description = "FastAPI backend for 4DT912 project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "pandas>=3.1.1",
    "numpy>=2.5.4",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "ruff",
]

[tool.mypy]
files = ["app"]
warn_unused_configs = true
check_untyped_defs = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
